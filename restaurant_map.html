<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Reviews Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .content {
            display: flex;
            height: calc(100vh - 300px);
            min-height: 600px;
        }

        #map {
            flex: 1;
            min-width: 60%;
        }

        .sidebar {
            width: 400px;
            background: #f8f9fa;
            overflow-y: auto;
            border-left: 2px solid #e9ecef;
        }

        .stats {
            padding: 20px;
            background: white;
            border-bottom: 2px solid #e9ecef;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-label {
            font-weight: 600;
            color: #495057;
        }

        .stat-value {
            color: #667eea;
            font-weight: bold;
        }

        .restaurant-list {
            padding: 20px;
        }

        .restaurant-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .restaurant-card h3 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .stars {
            color: #ffc107;
            font-size: 1.2em;
        }

        .rating-value {
            font-weight: bold;
            color: #495057;
        }

        .cuisine-tag {
            display: inline-block;
            padding: 5px 15px;
            background: #e9ecef;
            border-radius: 15px;
            font-size: 0.85em;
            margin: 5px 5px 5px 0;
            color: #495057;
        }

        .summary {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
            color: #6c757d;
            line-height: 1.6;
        }

        .youtuber-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: #ff0000;
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Custom Leaflet Popup Styling */
        .custom-popup {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-popup h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .custom-popup .popup-rating {
            color: #ffc107;
            font-size: 1.1em;
            margin: 5px 0;
        }

        .custom-popup .popup-summary {
            margin: 10px 0;
            color: #495057;
            line-height: 1.5;
        }

        .custom-popup .view-details {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .custom-popup .view-details:hover {
            background: #764ba2;
        }

        @media (max-width: 968px) {
            .content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 400px;
            }

            #map {
                min-width: 100%;
                height: 500px;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Restaurant Reviews Map</h1>
            <p>Curated reviews from top food YouTubers</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search restaurants...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-cuisine="all">All</button>
                <button class="filter-btn" data-cuisine="Italian">Italian</button>
                <button class="filter-btn" data-cuisine="Japanese">Japanese</button>
                <button class="filter-btn" data-cuisine="American">American</button>
                <button class="filter-btn" data-cuisine="Mexican">Mexican</button>
                <button class="filter-btn" data-cuisine="Asian">Asian</button>
            </div>
        </div>

        <div class="content">
            <div id="map"></div>
            <div class="sidebar">
                <div class="stats">
                    <h3>Overview</h3>
                    <div class="stat-item">
                        <span class="stat-label">Total Restaurants</span>
                        <span class="stat-value" id="totalRestaurants">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Average Rating</span>
                        <span class="stat-value" id="avgRating">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Reviews</span>
                        <span class="stat-value" id="totalReviews">0</span>
                    </div>
                </div>
                <div class="restaurant-list" id="restaurantList">
                    <div class="loading">Loading restaurants...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="restaurant_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
